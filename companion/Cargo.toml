[package]
name = "companion"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "0.35"
pishock = { path = "../pishock" }
openshock = { path = "../openshock" }
steamlocate = "2.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rand = "0.9"
serde_json = "1"
dirs = "6"
tempfile = "3"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

