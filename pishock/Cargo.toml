[package]
name = "pishock"
version = "0.1.0"
edition = "2024"
description = "Small synchronous client for the PiShock HTTP APIs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
mockito = "1"
