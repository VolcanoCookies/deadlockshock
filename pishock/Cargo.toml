[package]
name = "pishock"
version = "0.1.0"
edition = "2024"
description = "Synchronous client for PiShock's public HTTP API"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
mockito = "1"
